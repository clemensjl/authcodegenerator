name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal code to reproduce
      description: Use a dummy secret, never a real one.
      render: python
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Python and package version
      placeholder: Python 3.12, authcodegenerator 0.1.0
    validations:
      required: true
